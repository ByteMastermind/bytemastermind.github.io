{{ define "main" }}
{{ if isset .Data "Term" }}
<h1 class="page-title">Entries tagged "{{ .Data.Term }}"</h1>
{{ else }}
<h1 class="page-title">All articles</h1>
{{ end }}

<div class="post-grid">
	{{- range where .Data.Pages "Type" "not in" (.Site.Params.excludedTypes | default (slice "page")) -}}
	{{ partial "post-card.html" . }}
	{{- end -}}
</div>
{{ end }}
